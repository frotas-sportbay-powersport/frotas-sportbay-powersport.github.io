<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Frota Sportbay">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Sistema de Gestão de Frota — Sportbay Powersports</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{--k:#0b0d0c;--k2:#141816;--k3:#1f2521;--g:#2fe043;--gd:#16a02a;--gs:#e8fbea;--bg:#f2f4f3;--w:#fff;--line:#e2e6e3;--t:#121714;--m:#6b756f;--o:#ef8a00;--os:#fff3e0;--r:#e03b31;--rs:#fdecea;--sb:240px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--t);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
svg{flex:0 0 auto}
/* layout */
#side{position:fixed;inset:0 auto 0 0;width:var(--sb);background:var(--k);color:#cfd6d1;display:flex;flex-direction:column;z-index:20}
#side .lg{padding:22px 20px 18px;border-bottom:1px solid #1d231f}
#side .lg img{width:100%;max-width:170px;display:block}
#side .lg small{display:block;color:#7f8a83;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:8px}
#snav{flex:1;overflow:auto;padding:12px 10px}
#snav button,#mnav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:#b9c2bc;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;font-weight:600;font-size:14px;position:relative}
#snav button:hover{background:#151a17;color:#fff}
#snav button.on{background:var(--g);color:var(--k)}
.bd{margin-left:auto;background:#2a312c;color:#fff;font-size:11px;border-radius:999px;padding:2px 7px;font-style:normal}
.bd.o{background:var(--o)}
.on .bd{background:var(--k);color:var(--g)}
#side .me{padding:14px;border-top:1px solid #1d231f}
#wrap{margin-left:var(--sb);min-height:100vh}
#top{position:sticky;top:0;z-index:15;background:var(--w);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 24px}
#top .mlg{display:none}
#top h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;background:none;border:1px solid var(--line);border-radius:10px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer}
.ib i{position:absolute;top:-5px;right:-5px;background:var(--r);color:#fff;font-style:normal;font-size:11px;font-weight:700;border-radius:999px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 4px}
.ub{display:flex;align-items:center;gap:10px;background:none;border:1px solid var(--line);border-radius:12px;padding:5px 12px 5px 5px;cursor:pointer;text-align:left}
.av{width:32px;height:32px;border-radius:9px;background:var(--k);color:var(--g);display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 auto}
.ub b{display:block;font-size:13px;line-height:1.2}.ub small{display:block;font-size:11px;color:var(--m)}
#mnav{display:none}
main{padding:22px 24px 90px;max-width:1400px}
/* componentes */
.card{background:var(--w);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.card>h2,.ch{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.sub{color:var(--m);font-size:13px;margin:-6px 0 12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g2>*,.g3>*,.vh>*,.ff>*{min-width:0}
main{overflow-x:hidden}
.ff{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--w);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--m)}
.kpi.g:before{background:var(--g)}.kpi.o:before{background:var(--o)}.kpi.r:before{background:var(--r)}.kpi.k:before{background:var(--k)}
.kpi small{color:var(--m);font-size:12px;font-weight:600;display:block}
.kpi b{font-size:30px;display:block;margin-top:4px;line-height:1.1}
label.l{display:block;font-size:12px;font-weight:600;color:var(--m);margin-bottom:5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:42px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g);border-color:var(--g)}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--gd)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;min-height:42px;white-space:nowrap}
.btn.g{background:var(--g);border-color:var(--g);color:var(--k)}
.btn.k{background:var(--k);border-color:var(--k);color:#fff}
.btn.r{background:var(--r);border-color:var(--r);color:#fff}
.btn.ro{color:var(--r);border-color:#f3c1bd}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap;background:#eef0ef;color:var(--m)}
.chip:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.g{background:var(--gs);color:var(--gd)}.chip.o{background:var(--os);color:#b86400}.chip.r{background:var(--rs);color:var(--r)}.chip.k{background:#1b201d;color:var(--g)}
.al{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:14px;cursor:pointer}
.al.o{background:var(--os);color:#8a4b00}.al.r{background:var(--rs);color:#9b1c14}.al.g{background:var(--gs);color:#0f6b1e}
.info{background:#f6f8f7;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--m);font-size:14px}
.empty{padding:26px;text-align:center;color:var(--m)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.tw{overflow-x:auto}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border:0}
.li .tx{flex:1;min-width:0}.li .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .tx small{color:var(--m);font-size:12.5px}
.th{width:54px;height:40px;border-radius:8px;background:#eceeed center/cover no-repeat;display:grid;place-items:center;color:#a3aca6;flex:0 0 auto}
.seg{display:inline-flex;background:#eceeed;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--m)}
.seg button.on{background:#fff;color:var(--t);box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* agenda */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.dy{background:#f8faf9;border:1px solid var(--line);border-radius:12px;min-height:150px;padding:8px}
.dy.hj{border-color:var(--g);box-shadow:inset 0 0 0 1px var(--g)}
.dy.ov{background:var(--gs)}
.dy h4{margin:0 0 8px;font-size:12px;color:var(--m);display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.04em}
.bar{border-radius:9px;padding:7px 9px;margin-bottom:6px;font-size:12.5px;line-height:1.3;cursor:pointer;border-left:4px solid;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bar b{display:block}.bar small{display:block;color:var(--m)}
.bar.o{border-color:var(--o)}.bar.g{border-color:var(--g)}.bar.k{border-color:var(--k);background:#1b201d;color:#fff}.bar.k small{color:#aab3ad}.bar.m{border-color:#b9c1bc;opacity:.8}.bar.r{border-color:var(--r);opacity:.75}
.bar[draggable=true]{cursor:grab}
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.mes>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:96px;padding:6px;cursor:pointer;background:#fff}
.mes>div.fo{background:#f7f8f7;color:#b2b9b4}.mes>div.hj{box-shadow:inset 0 0 0 2px var(--g)}
.mes .dn{font-size:12px;font-weight:700}
.mes .ce{font-size:11px;border-radius:5px;padding:2px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#eef0ef}
.mes .ce.o{background:var(--os);color:#8a4b00}.mes .ce.g{background:var(--gs);color:#0f6b1e}.mes .ce.k{background:#1b201d;color:var(--g)}.mes .ce.m{color:var(--m)}.mes .ce.r{background:var(--rs);color:var(--r)}
.mh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:11px;color:var(--m);font-weight:700;text-transform:uppercase;padding:6px 0}
.leg{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
/* frota */
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.vc{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.15s}
.vc:hover{box-shadow:0 6px 18px rgba(0,0,0,.08)}
.vc .ph{height:150px;background:#eceeed center/cover no-repeat;display:grid;place-items:center;color:#a3aca6}
.vc .bd2{padding:12px 14px}
.vc h3{margin:0;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.vc p{margin:4px 0 0;color:var(--m);font-size:13px}
.vh{display:grid;grid-template-columns:320px 1fr;gap:18px}
.vh .ph{height:220px;border-radius:14px;background:#eceeed center/cover no-repeat;display:grid;place-items:center;color:#a3aca6}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kv div{background:#f6f8f7;border-radius:10px;padding:10px 12px}.kv small{display:block;color:var(--m);font-size:11.5px;font-weight:600}.kv b{font-size:15px}
/* checklist */
.ck h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--m);margin:16px 0 6px}
.ci{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:#fff}
.ci.ok{border-color:var(--g);background:var(--gs)}
.pics{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pics div{width:78px;height:78px;border-radius:10px;background:#eee center/cover;position:relative;cursor:pointer}
.pics div button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--r);color:#fff;cursor:pointer;font-weight:700}
.up{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:12px;padding:16px;cursor:pointer;color:var(--m);font-weight:600}
.up input{display:none}
/* modal/toast */
.modal{position:fixed;inset:0;background:rgba(5,8,6,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.box{background:#fff;border-radius:18px;width:100%;max-width:620px;max-height:90vh;overflow:auto;padding:22px}
.box h2{margin:0 0 14px;font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:#eef0ef;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--k);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:92%;font-weight:600;border-left:4px solid var(--g)}
.toast.r{border-color:var(--r)}.toast.show{opacity:1;transform:translateX(-50%)}
.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--g);color:var(--k);border:0;box-shadow:0 8px 22px rgba(0,0,0,.25);z-index:30;display:none;place-items:center;cursor:pointer}
.fab.show{display:grid}
.err{color:var(--r);font-size:13px;font-weight:600;margin-top:8px}
.dl{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.dl span{color:var(--m);flex:0 0 auto}.dl b{text-align:right;font-weight:600}
.big img{max-width:100%;border-radius:12px;display:block;margin:auto}
.prt{display:none}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){
  #side{display:none}#wrap{margin-left:0}
  #top{background:var(--k);border:0;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
  #top .mlg{display:block;height:24px}
  #top h1{display:none}#top .sp2{flex:1}
  #top .ib{border-color:#2a312c;color:#fff;width:40px;height:40px}
  #top .ub{border-color:#2a312c;padding:4px}#top .ub>div{display:none}
  #mnav{display:flex;position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:14;background:var(--k);gap:6px;overflow-x:auto;padding:0 10px 10px;scrollbar-width:none}
  #mnav::-webkit-scrollbar{display:none}
  #mnav button{width:auto;flex:0 0 auto;padding:8px 12px;font-size:13px;gap:7px;color:#c3cbc5;background:#161b18}
  #mnav button.on{background:var(--g);color:var(--k)}
  #mnav button svg{width:16px;height:16px}
  main{padding:14px 10px 100px}
  .g2,.g3,.vh{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi b{font-size:26px}
  .card{padding:14px;border-radius:14px}
  body,input,select,textarea{font-size:16px}
  .btn{min-height:44px}
  .row>.btn{flex:1 1 auto}
  .row>.btn.sm{flex:0 0 auto}
  .wk{grid-template-columns:1fr}.dy{min-height:0}.dy.vz{display:none}
  .bar{font-size:14px;padding:10px 12px}
  .mes>div{min-height:62px;padding:4px}.mes .ce{font-size:0;height:6px;padding:0;margin-top:3px}
  table.cards,table.cards tbody,table.cards tr,table.cards td{display:block;width:100%}
  table.cards tr:first-child{display:none}
  table.cards tr{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px}
  table.cards td{border:0;padding:5px 0;display:flex;justify-content:space-between;gap:14px;text-align:right}
  table.cards td:before{content:attr(data-l);color:var(--m);font-size:12.5px;font-weight:600;text-align:left}
  .modal{align-items:flex-end;padding:0}
  .box{border-radius:18px 18px 0 0;max-height:92vh;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
}
@media print{
  #side,#top,#mnav,.fab,.noprint,.toast{display:none!important}
  #wrap{margin:0}main{padding:0}body{background:#fff}
  .card{border:1px solid #ccc;break-inside:avoid}
  .prt{display:block;margin-bottom:12px}
}
</style>
</head>
<body>
<aside id="side">
  <div class="lg"><img src="logo.png" alt="Sportbay"><small>Gestão de Frota</small></div>
  <nav id="snav"></nav>
  <div class="me" id="sme"></div>
</aside>
<div id="wrap">
  <header id="top">
    <img class="mlg" src="logo.png" alt="Sportbay"><h1 id="ptitle"></h1><span class="sp2"></span>
    <button class="ib" id="bell" aria-label="Notificações"></button>
    <button class="ub" id="ubtn"></button>
  </header>
  <nav id="mnav"></nav>
  <main id="main"></main>
</div>
<button class="fab" id="fab" aria-label="Nova reserva"></button>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
// ============ utilidades ============
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const TODAY=()=>iso(new Date());
const nowStr=()=>{const d=new Date();return iso(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const br=s=>{if(!s)return'—';const d=parse(s);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`};
const brc=s=>{const d=parse(s);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
const fdt=t=>t?new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const km=v=>v||v===0?(+v).toLocaleString('pt-BR')+' km':'—';
const money=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const dias=(a,b)=>Math.round((parse(b)-parse(a))/864e5)+1;
const DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function toast(m,c){const t=$('#toast');t.textContent=m;t.className='toast show '+(c||'');clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',2800)}
const I={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
add:'<path d="M12 5v14M5 12h14"/>',
check:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
clip:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 14l2 2 4-4"/>',
truck:'<path d="M1 4h14v12H1zM15 9h4l4 4v3h-8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',

function migrate(d){
  if(!d||!Array.isArray(d.res))return seed();
  if(d.ver===2)return d;
  d.users.forEach(u=>{if(!PERFIS[u.perfil])u.perfil='solicitante'});
  d.fleet.forEach(f=>{f.marca=f.marca||'';f.ano=f.ano||'';f.km=f.km===undefined?'':f.km;f.foto=f.foto||'';f.docs=f.docs||[];f.manut=f.manut||[];f.prevData=f.prevData||'';f.prevKm=f.prevKm||''});
  d.res.forEach(r=>{r.horaSaida=r.horaSaida||'08:00';r.horaRetorno=r.horaRetorno||'18:00';if(r.status==='rejeitada')r.status='reprovada';r.hist=r.hist||[];r.custos=r.custos||{};r.criado=r.criado||0;r.apoios=r.apoios||[];
    r.checklists=(r.checklists||[]).map(c=>({fase:c.fase==='Saída'?'Retirada':c.fase==='Retorno'?'Devolução':c.fase,quando:c.quando||0,vistoriador:c.vistoriador||'—',responsavel:c.responsavel||r.motorista,km:c.km,comb:c.comb,itens:c.itens||{},fotos:c.fotos||[],obs:c.obs||''}));
    if(!r.aprovacao&&['aprovada','reprovada','em_uso','concluida'].includes(r.status)){const h=(r.hist||[]).find(x=>/Aprovada|Rejeitada/.test(x.txt));r.aprovacao={dec:r.status==='reprovada'?'reprovada':'aprovada',por:h?h.quem:'—',quando:0,just:h&&/Rejeitada: (.*)/.test(h.txt)?h.txt.replace('Rejeitada: ',''):''}}});
  d.perm=JSON.parse(JSON.stringify(PERM_PADRAO));d.log=d.log||[];d.seen={};d.cfg=d.cfg||{};d.ver=2;
  return d;
}

function alertas(){

    if(f.prevKm&&f.km!==''&&+f.km>=+f.prevKm-1000)a.push({c:+f.km>=+f.prevKm?'r':'o',txt:`${f.placa}: revisão por quilometragem (${km(f.km)} de ${km(f.prevKm)})`,veh:f.id});
  });

function notifs(){const m=me(),seen=DB.seen[m.id]||0,n=[];

  if(can('manutencao')||can('frota')||m.perfil==='gerente')n.push(...alertas());

function compress(file,max=900,q=.6){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};im.onerror=no;im.src=fr.result};fr.onerror=no;fr.readAsDataURL(file)})}

// ============ AGENDA ============
function filtrarAg(){
  const h=TODAY();
  let l=DB.res.filter(r=>(!S.fMot||r.motorista===S.fMot)&&(!S.fVei||r.tracao===S.fVei||r.apoios.includes(S.fVei))&&(S.fSit?r.status===S.fSit:!['reprovada','cancelada'].includes(r.status)));
  const oc=S.passadas?0:l.filter(r=>r.retorno<h).length;
  if(!S.passadas)l=l.filter(r=>r.retorno>=h);
  return [l,oc];
}
function barra(r,d){const c=ST[r.status][1],drag=can('arrastar')&&['pendente','aprovada'].includes(r.status)&&r.saida===d;
  const hr=`${r.saida===d?r.horaSaida:'···'} – ${r.retorno===d?r.horaRetorno:'···'}`;
  return `<div class="bar ${c}" data-open="${r.id}" data-id="${r.id}" ${drag?'draggable="true"':''}><b>${placas(r)}</b><small>${hr} · ${esc(r.chamado)}</small><small>${esc(U(r.motorista).nome)}</small></div>`}
function vAgenda(){
  const [l,oc]=filtrarAg(),a=parse(S.agData),h=TODAY(),mode=S.agMode;
  let titulo,corpo;
  if(mode==='dia'){
    titulo=`${DS[a.getDay()]}, ${br(S.agData)}`;
    const it=l.filter(r=>r.saida<=S.agData&&r.retorno>=S.agData).sort((x,y)=>dts(x).localeCompare(dts(y)));

  }else if(mode==='semana'){
    const ini=addDays(a,-((a.getDay()+6)%7)),ds=[...Array(7)].map((_,i)=>iso(addDays(ini,i)));
    titulo=`${br(ds[0])} – ${br(ds[6])}`;
    corpo=`<div class="wk">${ds.map(d=>{const dd=parse(d),it=l.filter(r=>r.saida<=d&&r.retorno>=d).sort((x,y)=>dts(x).localeCompare(dts(y)));
      return `<div class="dy ${d===h?'hj':''} ${it.length?'':'vz'}" data-day="${d}"><h4><span>${DS[dd.getDay()]} ${brc(d)}</span><span>${it.length||''}</span></h4>${it.map(r=>barra(r,d)).join('')}</div>`}).join('')}</div>
      ${l.some(r=>r.saida<=ds[6]&&r.retorno>=ds[0])?'':'<div class="empty">Nenhuma reserva nesta semana.</div>'}`;
  }else{
    const p=new Date(a.getFullYear(),a.getMonth(),1),ini=addDays(p,-((p.getDay()+6)%7));
    titulo=`${MS[a.getMonth()]} de ${a.getFullYear()}`;
    corpo=`<div class="mh">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<span style="text-align:center">${x}</span>`).join('')}</div><div class="mes">${[...Array(42)].map((_,i)=>{const d=iso(addDays(ini,i)),dd=parse(d),it=l.filter(r=>r.saida<=d&&r.retorno>=d);

  const mots=DB.users.filter(u=>u.perfil==='motorista');
  return `<div class="card">
    <div class="row" style="margin-bottom:12px"><div class="seg">${['dia','semana','mes'].map(x=>`<button data-mode="${x}" class="${mode===x?'on':''}">${{dia:'Dia',semana:'Semana',mes:'Mês'}[x]}</button>`).join('')}</div><span class="sp"></span>

    <div class="row" style="margin-bottom:12px"><b style="font-size:17px">${titulo}</b><span class="sp"></span>${oc?`<span class="chip">${oc} encerradas ocultas</span>`:''}</div>
    <div class="ff" style="margin-bottom:14px">
      <div><label class="l">Motorista</label><select id="fMot"><option value="">Todos</option>${mots.map(x=>`<option value="${x.id}" ${S.fMot===x.id?'selected':''}>${esc(x.nome)}</option>`).join('')}</select></div>

      <div><label class="l">&nbsp;</label><label class="row" style="min-height:42px;cursor:pointer"><input type="checkbox" id="fPas" ${S.passadas?'checked':''}> Mostrar encerradas</label></div>

function bAgenda(){
  $$('[data-mode]').forEach(b=>b.onclick=()=>{S.agMode=b.dataset.mode;render()});
  $$('[data-nav]').forEach(b=>b.onclick=()=>{const n=+b.dataset.nav;if(!n)S.agData=TODAY();else{const a=parse(S.agData);S.agData=iso(S.agMode==='dia'?addDays(a,n):S.agMode==='semana'?addDays(a,7*n):new Date(a.getFullYear(),a.getMonth()+n,1))}render()});
  $('#fMot').onchange=e=>{S.fMot=e.target.value;render()};$('#fVei').onchange=e=>{S.fVei=e.target.value;render()};$('#fSit').onchange=e=>{S.fSit=e.target.value;render()};$('#fPas').onchange=e=>{S.passadas=e.target.checked;render()};
  $$('[data-dia]').forEach(c=>c.onclick=()=>{S.agData=c.dataset.dia;S.agMode='dia';render()});
  $$('.bar[draggable]').forEach(b=>b.ondragstart=e=>{e.dataTransfer.setData('text',b.dataset.id)});
  $$('.dy').forEach(d=>{d.ondragover=e=>{if(can('arrastar')){e.preventDefault();d.classList.add('ov')}};d.ondragleave=()=>d.classList.remove('ov');d.ondrop=e=>{e.preventDefault();d.classList.remove('ov');mover(e.dataTransfer.getData('text'),d.dataset.day)}});

function mover(id,dia,hs){
  const r=DB.res.find(x=>x.id===id);if(!r||!can('arrastar'))return;
  if(dia<TODAY())return toast('Não é possível agendar no passado.','r');
  const dur=dias(r.saida,r.retorno)-1,novo={...r,saida:dia,retorno:iso(addDays(parse(dia),dur)),horaSaida:hs||r.horaSaida};
  if(dte(novo)<=dts(novo))return toast('A devolução precisa ser depois da retirada.','r');
  const c=conflitos(novo,r.id);if(c.length)return toast('Conflito com '+c.map(x=>x.chamado).join(', ')+'. Reserva não movida.','r');
  log(`Reagendou ${r.chamado} de ${br(r.saida)} para ${br(dia)}`,r);Object.assign(r,{saida:novo.saida,retorno:novo.retorno,horaSaida:novo.horaSaida});render();toast(`${r.chamado} movida para ${br(dia)}`);
}

function bNova(){
  const f=$('#fNova');f.querySelectorAll('.ci input').forEach(c=>c.onchange=()=>c.closest('.ci').classList.toggle('ok',c.checked));
  f.onsubmit=e=>{e.preventDefault();const d=new FormData(f),g=k=>(d.get(k)||'').trim();
    const r={id:uid('r'),chamado:g('chamado'),tracao:g('tracao'),apoios:d.getAll('apoios'),motorista:g('motorista'),solicitante:me().id,saida:g('saida'),horaSaida:g('horaSaida'),retorno:g('retorno'),horaRetorno:g('horaRetorno'),destino:g('destino'),obs:g('obs'),status:'pendente',hist:[],checklists:[],criado:Date.now(),custos:{}};
    const err=t=>$('#nErr').textContent=t;
    if(!r.tracao)return err('Selecione um veículo de tração disponível.');
    if(!r.motorista)return err('Cadastre ao menos um motorista ativo.');
    if(dts(r)<nowStr().slice(0,16)&&r.saida<TODAY())return err('A retirada não pode ser no passado.');
    if(dte(r)<=dts(r))return err('A devolução precisa ser depois da retirada.');
    if(DB.res.some(x=>x.chamado.toLowerCase()===r.chamado.toLowerCase()))return err('Já existe uma reserva com esse número de chamado.');
    const c=conflitos(r);if(c.length)return err('Conflito: '+c.map(x=>`${x.chamado} (${F(x.tracao).placa}, ${U(x.motorista).nome}, ${brc(x.saida)} ${x.horaSaida}–${brc(x.retorno)} ${x.horaRetorno})`).join('; '));
    DB.res.push(r);log(`Criou a reserva ${r.chamado} (${F(r.tracao).placa})`,r);go(can('aprovar')?'aprov':'agenda');toast(`Reserva ${r.chamado} enviada para aprovação`);
  };
}

function vCheck(){

    <div class="g2">${grp('Aguardando retirada',l.filter(x=>x.status==='aprovada'))}${grp('Aguardando devolução',l.filter(x=>x.status==='em_uso'))}</div>
    <div class="card"><h2>Últimos checklists</h2><div class="tw"><table class="cards"><tr><th>Chamado</th><th>Tipo</th><th>Veículo</th><th>Data</th><th>Vistoriador</th><th>Km</th><th>Fotos</th></tr>${hist.map(({r,c})=>`<tr data-open="${r.id}" style="cursor:pointer"><td data-l="Chamado"><b>${esc(r.chamado)}</b></td><td data-l="Tipo">${c.fase}</td><td data-l="Veículo">${esc(F(r.tracao).placa)}</td><td data-l="Data">${fdt(c.quando)}</td><td data-l="Vistoriador">${esc(c.vistoriador)}</td><td data-l="Km">${km(c.km)}</td><td data-l="Fotos">${c.fotos.length}</td></tr>`).join('')}</table>${hist.length?'':'<div class="empty">Nenhum checklist registrado.</div>'}</div></div>`;}
  const fase=r.status==='aprovada'?'Retirada':'Devolução',v=F(r.tracao),ret=r.checklists.find(c=>c.fase==='Retirada');
  const kmMin=fase==='Devolução'&&ret?ret.km:(v.km||0);
  const pessoas=DB.users.filter(u=>u.ativo);
  return `<form id="fCk" class="card ck">
   <div class="row"><button type="button" class="btn sm" id="ckBack">${ic('back',16)} Voltar</button><span class="sp"></span>${chip(r.status)}</div>
   <h2 style="margin-top:14px">Checklist de ${fase.toLowerCase()} — ${esc(r.chamado)}</h2>
   <div class="kv"><div><small>Veículos</small><b>${placas(r)}</b></div><div><small>Motorista</small><b>${esc(U(r.motorista).nome)}</b></div><div><small>${fase==='Retirada'?'Retirada prevista':'Devolução prevista'}</small><b>${fase==='Retirada'?br(r.saida)+' '+r.horaSaida:br(r.retorno)+' '+r.horaRetorno}</b></div><div><small>Vistoriador</small><b>${esc(me().nome)}</b></div></div>
   <div class="row" style="margin-top:12px"><button type="button" class="btn sm" id="ckAll">Marcar todos como OK</button></div>
   ${Object.entries(CK).map(([sec,its])=>`<h3>${sec}</h3>${its.map(it=>`<label class="ci"><input type="checkbox" name="it" value="${esc(it)}"><span>${esc(it)}</span></label>`).join('')}`).join('')}
   <h3>Medições</h3>
   <div class="ff"><div><label class="l">Quilometragem de ${fase==='Retirada'?'saída':'retorno'} (km)</label><input type="number" name="km" required min="${kmMin||0}" value="${fase==='Retirada'&&v.km!==''?v.km:''}" placeholder="${kmMin?'mín. '+kmMin:'Ex.: 152340'}"></div>
    <div><label class="l">Combustível</label><select name="comb">${COMB.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div><label class="l">${fase==='Retirada'?'Retirado por':'Devolvido por'}</label><select name="resp">${pessoas.map(u=>`<option value="${u.id}" ${u.id===r.motorista?'selected':''}>${esc(u.nome)}</option>`).join('')}</select></div></div>
   ${fase==='Devolução'?`<h3>Custos da viagem (opcional)</h3><div class="ff"><div><label class="l">Combustível (R$)</label><input type="number" step="0.01" min="0" name="cComb"></div><div><label class="l">Pedágios (R$)</label><input type="number" step="0.01" min="0" name="cPed"></div><div><label class="l">Outros (R$)</label><input type="number" step="0.01" min="0" name="cOut"></div></div>`:''}
   <h3>Fotos da ${fase.toLowerCase()} (obrigatório ao menos 1)</h3>
   <label class="up">${ic('cam')} Tirar / anexar fotos<input type="file" id="ckF" accept="image/*" multiple capture="environment"></label>
   <div class="pics" id="ckP"></div>
   <h3>Avarias e observações</h3><textarea name="obs" placeholder="Descreva avarias, riscos, itens faltando... (obrigatório se algum item não estiver OK)"></textarea>
   <div id="ckErr" class="err"></div>
   <div class="row" style="margin-top:14px"><button class="btn g" type="submit">${ic('check',18)} Registrar ${fase.toLowerCase()}${fase==='Retirada'?' e liberar veículo':' e concluir'}</button></div>
  </form>`;
}
function bCheck(){
  $$('[data-ck]').forEach(x=>x.onclick=()=>{S.ckRes=x.dataset.ck;ckFotos=[];render();window.scrollTo(0,0)});
  const f=$('#fCk');if(!f)return;
  const r=DB.res.find(x=>x.id===S.ckRes),fase=r.status==='aprovada'?'Retirada':'Devolução';
  const pics=()=>{$('#ckP').innerHTML=ckFotos.map((p,i)=>`<div style="background-image:url(${p})" data-pic="${p}"><button type="button" data-rm="${i}">×</button></div>`).join('');$$('[data-rm]').forEach(b=>b.onclick=e=>{e.stopPropagation();ckFotos.splice(+b.dataset.rm,1);pics()})};pics();
  $('#ckBack').onclick=()=>{S.ckRes='';ckFotos=[];render()};
  f.querySelectorAll('.ci input').forEach(c=>c.onchange=()=>c.closest('.ci').classList.toggle('ok',c.checked));
  $('#ckAll').onclick=()=>f.querySelectorAll('.ci input').forEach(c=>{c.checked=true;c.closest('.ci').classList.add('ok')});
  $('#ckF').onchange=async e=>{for(const fl of e.target.files){try{ckFotos.push(await compress(fl,800,.55))}catch(x){toast('Não foi possível ler uma das fotos.','r')}}e.target.value='';pics()};
  f.onsubmit=e=>{e.preventDefault();const d=new FormData(f),err=t=>$('#ckErr').textContent=t;
    const itens={};f.querySelectorAll('.ci input').forEach(c=>itens[c.value]=c.checked);
    const falt=Object.values(itens).filter(x=>!x).length,obs=(d.get('obs')||'').trim(),k=d.get('km');
    const ret=r.checklists.find(c=>c.fase==='Retirada');
    if(k===''||isNaN(+k))return err('Informe a quilometragem.');
    if(fase==='Devolução'&&ret&&+k<+ret.km)return err(`A quilometragem de retorno não pode ser menor que a de saída (${km(ret.km)}).`);
    if(falt&&!obs)return err(`${falt} item(ns) não marcados como OK: descreva em "Avarias e observações".`);
    if(!ckFotos.length)return err('Anexe ao menos uma foto do veículo.');
    r.checklists.push({fase,quando:Date.now(),vistoriador:me().nome,responsavel:d.get('resp'),km:+k,comb:d.get('comb'),itens,fotos:ckFotos.slice(),obs});
    const v=F(r.tracao);if(v.id&&(v.km===''||+k>+v.km))v.km=+k;
    if(fase==='Retirada'){r.status='em_uso';log(`Checklist de retirada de ${r.chamado}: ${v.placa} liberado para ${U(d.get('resp')).nome}`,r)}
    else{r.status='concluida';r.custos={combustivel:+d.get('cComb')||0,pedagio:+d.get('cPed')||0,outros:+d.get('cOut')||0};log(`Checklist de devolução de ${r.chamado}: ${v.placa} devolvido por ${U(d.get('resp')).nome} (${km(kmRodado(r))} rodados)`,r)}
    S.ckRes='';ckFotos=[];if(!save()){r.checklists.pop();return err('Sem espaço para salvar as fotos. Use menos fotos ou faça um backup e limpe fotos antigas.')}
    render();toast(fase==='Retirada'?'Veículo liberado — reserva em uso':'Devolução registrada — reserva concluída');
  };
}

  <div><label class="l">Ano de fabricação</label><input type="number" name="ano" min="1950" max="2100" value="${f.ano}"></div><div><label class="l">Quilometragem atual</label><input type="number" name="km" min="0" value="${f.km}"></div>
  <div><label class="l">Situação</label><select name="status">${['Disponível','Manutenção','Inativo'].map(x=>`<option ${f.status===x?'selected':''}>${x}</option>`).join('')}</select></div>
  <div><label class="l">Próxima revisão (data)</label><input type="date" name="prevData" value="${f.prevData}"></div><div><label class="l">Próxima revisão (km)</label><input type="number" name="prevKm" value="${f.prevKm}"></div></div>
  <div id="vErr" class="err"></div>
  <div class="row" style="justify-content:flex-end;margin-top:14px">${!nv&&can('frota')?'<button type="button" class="btn ro" id="vDel">Excluir</button>':''}<span class="sp"></span><button class="btn g">Salvar</button></div></form>`);
  $('#vF').onchange=async e=>{const fl=e.target.files[0];if(!fl)return;ft=await compress(fl,900,.6);const p=$('#vPh');p.style.backgroundImage=`url(${ft})`;p.firstChild.nodeType===3||p.querySelector('svg')?p.childNodes.forEach(n=>{if(n.tagName!=='INPUT')n.remove?.()}):0};
  if($('#vDel'))$('#vDel').onclick=()=>{if(DB.res.some(r=>(r.tracao===f.id||r.apoios.includes(f.id))))return $('#vErr').textContent='Este veículo tem reservas no histórico. Para preservar os registros, altere a situação para "Inativo" em vez de excluir.';
    confirmar(`Excluir ${esc(f.placa)}?`,()=>{DB.fleet=DB.fleet.filter(x=>x.id!==f.id);log(`Excluiu o veículo ${f.placa}`);S.veh='';render()},'Excluir','r')};
  $('#fV').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),g=k=>(d.get(k)||'').trim();
    const o={placa:g('placa').toUpperCase(),tipo:g('tipo'),marca:g('marca'),modelo:g('modelo'),ano:g('ano')?+g('ano'):'',km:g('km')!==''?+g('km'):'',status:g('status'),prevData:g('prevData'),prevKm:g('prevKm')?+g('prevKm'):'',foto:ft||''};
    if(DB.fleet.some(x=>x.placa===o.placa&&x.id!==f.id))return $('#vErr').textContent='Já existe um veículo com essa placa.';
    if(nv){const n={id:uid('f'),docs:[],manut:[],...o};DB.fleet.push(n);S.veh=n.id;log(`Cadastrou o veículo ${o.placa}`)}else{Object.assign(DB.fleet.find(x=>x.id===f.id),o);log(`Atualizou o cadastro de ${o.placa}`)}
    closeModal();if(!save())return;render();toast('Veículo salvo')};
}

// ============ USUÁRIOS ============
function vUsers(){
  return `<div class="card"><h2>Usuários <button class="btn g sm" id="uNovo">${ic('add',16)} Novo usuário</button></h2>
  <div class="tw"><table class="cards"><tr><th>Nome</th><th>Perfil</th><th>E-mail</th><th>CNH</th><th>Situação</th><th></th></tr>
  ${DB.users.map(u=>`<tr><td data-l="Nome"><div class="row" style="flex-wrap:nowrap"><span class="av" style="width:30px;height:30px;font-size:11px">${ini(u.nome)}</span><b>${esc(u.nome)}</b></div></td><td data-l="Perfil">${PERFIS[u.perfil]}</td><td data-l="E-mail">${esc(u.email)||'—'}</td><td data-l="CNH">${esc(u.cnh)||'—'}</td><td data-l="Situação"><span class="chip ${u.ativo?'g':''}">${u.ativo?'Ativo':'Inativo'}</span></td><td><button class="btn sm" data-ue="${u.id}">Editar</button></td></tr>`).join('')}</table></div></div>`;
}
function bUsers(){
  const form=u=>{const nv=!u;u=u||{nome:'',perfil:'motorista',email:'',cnh:'',ativo:true};
    openModal(`<h2>${nv?'Novo usuário':'Editar usuário'} <button class="x" onclick="closeModal()">×</button></h2><form id="fU"><div class="ff">
    <div><label class="l">Nome</label><input name="nome" required value="${esc(u.nome)}"></div><div><label class="l">E-mail</label><input type="email" name="email" value="${esc(u.email)}"></div>
    <div><label class="l">Perfil</label><select name="perfil">${Object.entries(PERFIS).map(([k,v])=>`<option value="${k}" ${u.perfil===k?'selected':''}>${v}</option>`).join('')}</select></div>
    <div><label class="l">CNH (categoria)</label><input name="cnh" value="${esc(u.cnh||'')}" placeholder="Ex.: E"></div>
    <div><label class="l">Situação</label><select name="ativo"><option value="1" ${u.ativo?'selected':''}>Ativo</option><option value="0" ${u.ativo?'':'selected'}>Inativo</option></select></div></div>
    <div id="uErr" class="err"></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn g">Salvar</button></div></form>`);
    $('#fU').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);const o={nome:d.get('nome').trim(),email:d.get('email').trim(),perfil:d.get('perfil'),cnh:d.get('cnh').trim(),ativo:d.get('ativo')==='1'};
      if(!nv&&u.id===S.user&&(!o.ativo||(o.perfil!=='gerente'&&!DB.users.some(x=>x.id!==u.id&&x.perfil==='gerente'&&x.ativo))))return $('#uErr').textContent='Mantenha ao menos um Gerente ativo no sistema.';
      if(nv){DB.users.push({id:uid('u'),...o});log(`Cadastrou o usuário ${o.nome}`)}else{Object.assign(DB.users.find(x=>x.id===u.id),o);log(`Atualizou o usuário ${o.nome}`)}closeModal();render();toast('Usuário salvo')}};
  $('#uNovo').onclick=()=>form();$$('[data-ue]').forEach(b=>b.onclick=()=>form(DB.users.find(u=>u.id===b.dataset.ue)));
}

// ============ RELATÓRIOS ============
function relDados(){
  const de=S.relDe,at=S.relAte,inP=d=>d>=de&&d<=at;
  const rs=DB.res.filter(r=>inP(r.saida)),fin=rs.filter(r=>['em_uso','concluida'].includes(r.status));
  const T=[];
  T.push({t:'Reservas por período',h:['Chamado','Retirada','Devolução','Veículo','Motorista','Destino','Situação'],r:rs.sort((a,b)=>dts(a).localeCompare(dts(b))).map(r=>[r.chamado,br(r.saida)+' '+r.horaSaida,br(r.retorno)+' '+r.horaRetorno,F(r.tracao).placa+(r.apoios.length?' + '+r.apoios.map(a=>F(a).placa).join(', '):''),U(r.motorista).nome,r.destino,ST[r.status][0]])});
  T.push({t:'Utilização por veículo',h:['Placa','Veículo','Reservas','Dias em uso','Km rodados'],r:DB.fleet.map(f=>{const u=fin.filter(r=>r.tracao===f.id||r.apoios.includes(f.id));return [f.placa,vNome(f),u.length,u.reduce((a,r)=>a+dias(r.saida,r.retorno),0),u.filter(r=>r.tracao===f.id).reduce((a,r)=>a+kmRodado(r),0)]}).filter(x=>x[2])});
  T.push({t:'Utilização por motorista',h:['Motorista','Reservas','Dias em viagem','Km rodados'],r:DB.users.map(u=>{const x=fin.filter(r=>r.motorista===u.id);return [u.nome,x.length,x.reduce((a,r)=>a+dias(r.saida,r.retorno),0),x.reduce((a,r)=>a+kmRodado(r),0)]}).filter(x=>x[1])});
  T.push({t:'Quilometragem percorrida',h:['Chamado','Veículo','Km saída','Km retorno','Km rodados'],r:fin.filter(r=>kmRodado(r)).map(r=>{const s=r.checklists.find(c=>c.fase==='Retirada'),e=r.checklists.find(c=>c.fase==='Devolução');return [r.chamado,F(r.tracao).placa,s.km,e.km,kmRodado(r)]})});
  const mt=DB.fleet.flatMap(f=>f.manut.filter(m=>inP(m.data)).map(m=>({f,m})));
  T.push({t:'Histórico de manutenções',h:['Data','Placa','Tipo','Descrição','Km','Custo (R$)'],r:mt.sort((a,b)=>a.m.data.localeCompare(b.m.data)).map(({f,m})=>[br(m.data),f.placa,m.tipo,m.desc,m.km,+m.custo||0])});
  const ap=DB.res.filter(r=>r.aprovacao&&r.aprovacao.quando&&inP(iso(new Date(r.aprovacao.quando)))||r.aprovacao&&!r.aprovacao.quando&&inP(r.saida));
  T.push({t:'Solicitações aprovadas e reprovadas',h:['Chamado','Decisão','Responsável','Data e hora','Justificativa'],r:ap.map(r=>[r.chamado,r.aprovacao.dec==='aprovada'?'Aprovada':'Reprovada',r.aprovacao.por,fdt(r.aprovacao.quando),r.aprovacao.just||''])});
  const cu=rs.filter(r=>r.custos&&((+r.custos.combustivel||0)+(+r.custos.pedagio||0)+(+r.custos.outros||0)));
  T.push({t:'Custos operacionais',h:['Origem','Placa','Combustível (R$)','Pedágios (R$)','Outros / manutenção (R$)','Total (R$)'],r:[...cu.map(r=>{const c=r.custos,t=(+c.combustivel||0)+(+c.pedagio||0)+(+c.outros||0);return [r.chamado,F(r.tracao).placa,+c.combustivel||0,+c.pedagio||0,+c.outros||0,t]}),...mt.filter(x=>+x.m.custo).map(({f,m})=>['Manutenção '+br(m.data),f.placa,0,0,+m.custo,+m.custo])]});
  const R={total:rs.length,aprov:ap.filter(r=>r.aprovacao.dec==='aprovada').length,reprov:ap.filter(r=>r.aprovacao.dec==='reprovada').length,km:fin.reduce((a,r)=>a+kmRodado(r),0),custo:T[6].r.reduce((a,x)=>a+x[5],0)};
  return {T,R};
}
function vRel(){
  const h=new Date();if(!S.relDe)S.relDe=iso(new Date(h.getFullYear(),h.getMonth(),1));if(!S.relAte)S.relAte=TODAY();
  const {T,R}=relDados(),money2=v=>typeof v==='number'?v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):esc(v);
  return `<div class="prt"><img src="logo.png" style="height:28px;background:#0b0d0c;padding:6px 10px;border-radius:6px"><h2>Relatório de Frota — ${br(S.relDe)} a ${br(S.relAte)}</h2><small>Emitido em ${fdt(Date.now())} por ${esc(me().nome)}</small></div>
  <div class="card noprint"><div class="ff"><div><label class="l">De</label><input type="date" id="rDe" value="${S.relDe}"></div><div><label class="l">Até</label><input type="date" id="rAte" value="${S.relAte}"></div>
   <div><label class="l">&nbsp;</label><div class="row" style="flex-wrap:nowrap"><button class="btn g" id="rXls">${ic('dl',18)} Excel</button><button class="btn k" id="rPdf">${ic('dl',18)} PDF</button></div></div></div></div>
  <div class="kpis">
   <div class="kpi k"><small>Reservas no período</small><b>${R.total}</b></div><div class="kpi g"><small>Aprovadas</small><b>${R.aprov}</b></div><div class="kpi r"><small>Reprovadas</small><b>${R.reprov}</b></div>
   <div class="kpi"><small>Km percorridos</small><b>${R.km.toLocaleString('pt-BR')}</b></div><div class="kpi o"><small>Custos operacionais</small><b style="font-size:22px">${money(R.custo)}</b></div><div class="kpi"><small>Veículos utilizados</small><b>${T[1].r.length}</b></div></div>
  ${T.map(t=>`<div class="card"><h2>${t.t} <span class="chip">${t.r.length}</span></h2><div class="tw"><table class="cards"><tr>${t.h.map(x=>`<th>${x}</th>`).join('')}</tr>${t.r.map(r=>`<tr>${r.map((c,i)=>`<td data-l="${t.h[i]}">${/R\$/.test(t.h[i])?money2(c):esc(c)}</td>`).join('')}</tr>`).join('')}</table>${t.r.length?'':'<div class="empty">Sem dados no período.</div>'}</div></div>`).join('')}`;
}
function bRel(){
  $('#rDe').onchange=e=>{S.relDe=e.target.value;render()};$('#rAte').onchange=e=>{S.relAte=e.target.value;render()};
  $('#rPdf').onclick=()=>{toast('Na janela de impressão, escolha "Salvar como PDF".');setTimeout(()=>window.print(),300)};
  $('#rXls').onclick=()=>{if(!window.XLSX)return toast('Não foi possível carregar o gerador de Excel. Verifique a internet.','r');
    const {T}=relDados(),wb=XLSX.utils.book_new();T.forEach(t=>{const ws=XLSX.utils.aoa_to_sheet([[t.t+' — '+br(S.relDe)+' a '+br(S.relAte)],[],t.h,...t.r]);ws['!cols']=t.h.map(()=>({wch:20}));XLSX.utils.book_append_sheet(wb,ws,t.t.slice(0,31))});
    XLSX.writeFile(wb,`relatorio-frota-sportbay_${S.relDe}_a_${S.relAte}.xlsx`);toast('Planilha Excel gerada')};
}

// ============ CONFIGURAÇÕES ============
function vCfg(){
  let bytes=0;try{bytes=(localStorage.getItem(K)||'').length*2}catch(e){}
  return `<div class="card"><h2>Permissões por perfil</h2><p class="sub">Marque o que cada perfil pode ver e fazer. As mudanças valem na hora. O Gerente sempre mantém acesso às configurações.</p>
  <div class="tw"><table><tr><th>Função</th>${Object.values(PERFIS).map(p=>`<th style="text-align:center">${p}</th>`).join('')}</tr>
  ${Object.entries(ACOES).map(([a,n])=>`<tr><td>${n}</td>${Object.keys(PERFIS).map(p=>`<td style="text-align:center"><input type="checkbox" data-p="${p}" data-a="${a}" ${DB.perm[p][a]?'checked':''} ${p==='gerente'&&a==='config'?'disabled':''}></td>`).join('')}</tr>`).join('')}</table></div>
  <div class="row" style="margin-top:12px"><button class="btn sm" id="pRst">Restaurar permissões padrão</button></div></div>
  <div class="g2"><div class="card"><h2>Backup dos dados</h2><p class="sub">Os dados ficam salvos automaticamente neste navegador (${(bytes/1048576).toFixed(2)} MB usados). Baixe um backup regularmente.</p>
   <div class="row"><button class="btn k" id="bkDl">${ic('dl',18)} Baixar backup</button><label class="btn">Restaurar backup<input type="file" id="bkUp" accept=".json,application/json" style="display:none"></label></div></div>
   <div class="card"><h2>Dados de exemplo</h2><p class="sub">Substitui todos os dados deste navegador pelos dados de demonstração. Faça um backup antes.</p><button class="btn ro" id="seedB">Restaurar dados de exemplo</button></div></div>
  <div class="card"><h2>Sobre</h2><p class="sub" style="margin:0">Sistema de Gestão de Frota — Sportbay Powersports · versão 2.0</p></div>`;
}
function bCfg(){
  $$('[data-p]').forEach(c=>c.onchange=()=>{DB.perm[c.dataset.p][c.dataset.a]=c.checked?1:0;log(`Alterou permissão "${ACOES[c.dataset.a]}" de ${PERFIS[c.dataset.p]}`);render();toast('Permissão atualizada')});
  $('#pRst').onclick=()=>confirmar('Restaurar as permissões padrão de todos os perfis?',()=>{DB.perm=JSON.parse(JSON.stringify(PERM_PADRAO));render();toast('Permissões restauradas')});
  $('#bkDl').onclick=()=>{const b=new Blob([JSON.stringify(DB)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`backup-frota-sportbay_${TODAY()}.json`;document.body.appendChild(a);a.click();a.remove();toast('Backup baixado')};
  $('#bkUp').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!Array.isArray(d.res)||!Array.isArray(d.fleet))throw 0;confirmar('Substituir os dados atuais pelo backup selecionado?',()=>{DB=migrate(d);if(!DB.users.find(u=>u.id===S.user))S.user=DB.users[0].id;render();toast('Backup restaurado')})}catch(x){toast('Arquivo de backup inválido.','r')}};fr.readAsText(fl)};
  $('#seedB').onclick=()=>confirmar('Isso apaga os dados atuais deste navegador e coloca os dados de exemplo. Continuar?',()=>{DB=seed();S.user='u1';render();toast('Dados de exemplo restaurados')},'Substituir dados','r');
}

const V={dash:[vDash],agenda:[vAgenda,bAgenda],nova:[vNova,bNova],aprov:[vAprov,bAprov],check:[vCheck,bCheck],frota:[vFrota,bFrota],users:[vUsers,bUsers],rel:[vRel,bRel],cfg:[vCfg,bCfg]};
render();
setInterval(()=>{if(!$('#modal').classList.contains('show')&&!document.activeElement.matches('input,textarea,select'))render()},60000);
</script>
